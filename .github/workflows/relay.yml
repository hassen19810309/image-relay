name: docker-image-relay
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Pull images from Docker Hub
        run: |
          docker pull vxcontrol/pentagi:latest
          docker pull vxcontrol/pgvector:latest

      - name: Tag for GHCR
        run: |
          docker tag vxcontrol/pentagi:latest ghcr.io/${{ github.repository_owner }}/pentagi:latest
          docker tag vxcontrol/pgvector:latest ghcr.io/${{ github.repository_owner }}/pgvector:latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pentagi:latest
          docker push ghcr.io/${{ github.repository_owner }}/pgvector:latest
