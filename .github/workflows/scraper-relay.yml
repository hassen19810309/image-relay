name: scraper-image-relay
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Pull scraper from Docker Hub
        run: docker pull vxcontrol/scraper:latest

      - name: Tag for GHCR
        run: docker tag vxcontrol/scraper:latest ghcr.io/${{ github.repository_owner }}/scraper:latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/scraper:latest
